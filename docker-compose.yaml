version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    restart: always

  app:
    build: ./app
    deploy:
      replicas: 3
    volumes:
      - /c/Users/User/Desktop/DevOps/Whist/logs/app_logs:/var/log
    restart: always

  db:
    build: ./db
    volumes:
      - /c/Users/User/Desktop/DevOps/Whist/logs/db_data:/var/lib/mysql
      - /c/Users/User/Desktop/DevOps/Whist/logs/db_logs:/var/log/mysql
    restart: always

volumes:
  app_logs:
  db_data:
  db_logs:  

