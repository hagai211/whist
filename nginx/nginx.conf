events {}

http {
    resolver 127.0.0.11 valid=10s;  # Use Docker's internal DNS resolver

    map $cookie_internal_ip $backend {
        default "app_cluster";  # Default to load balancing
        ~^(?<container>.+)$ "$container:5000";  # Extract container name
    }

    upstream app_cluster {
        zone backend 64k;  # Define shared memory for dynamic resolution
        server app:5000 resolve;  # Enable dynamic discovery
    }

    server {
        listen 80;

        location / {
            proxy_pass http://$backend;  # Use resolved backend server

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

