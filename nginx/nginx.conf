events {}

http {
    resolver 127.0.0.11 valid=10s;  # Use Docker's internal DNS resolver

    map $cookie_server_ip $backend {
        default app:5000;  # Default to any app container
        ~^(?<ip>.+)$ $ip:5000;
    }

    upstream app_cluster {
        hash $cookie_session_id consistent;
        server whist-app-1:5000;
        server whist-app-2:5000;
        server whist-app-3:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://$backend;  # Use resolved backend server

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cookie_path / "/; HttpOnly; Secure; Max-Age=300";
            add_header Set-Cookie "session_id=$remote_addr; Path=/; Max-Age=300; HttpOnly";
        }
    }
}test

